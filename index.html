<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<meta name="theme-color" content="#0f172a">
<title>הכסף שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f1f5f9;font-family:'Heebo',sans-serif;direction:rtl;overscroll-behavior:none;font-size:16px}
input,button,select,textarea{font-family:'Heebo',sans-serif;direction:rtl}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:#6366f1!important;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
::-webkit-scrollbar{display:none}
button:active{opacity:.8;transform:scale(.97)}

/* ── ROOT ── */
#app{width:100%;min-height:100dvh;background:#f1f5f9;position:relative;overflow:hidden}

/* ── SETUP ── */
#setup{position:fixed;inset:0;background:#0f172a;z-index:600;overflow-y:auto;display:flex;flex-direction:column}
#setup.off{display:none}
.s-prog{display:flex;gap:4px;padding:16px 20px 0;flex-shrink:0}
.s-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1)}
.s-dot.done{background:#818cf8}.s-dot.on{background:#6366f1}
.s-head{padding:32px 24px 0;color:#fff;flex-shrink:0}
.s-ico{font-size:42px;margin-bottom:12px;line-height:1}
.s-title{font-size:28px;font-weight:900;line-height:1.2;margin-bottom:6px}
.s-sub{font-size:16px;color:#64748b;line-height:1.55}
.s-body{flex:1;padding:24px 24px 0;overflow-y:auto}
.s-foot{padding:18px 24px 28px;flex-shrink:0}
.sf{margin-bottom:16px}
.sf label{font-size:14px;font-weight:700;color:#64748b;display:block;margin-bottom:6px}
.si{width:100%;padding:16px 16px;border-radius:13px;border:1.5px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#fff;font-size:18px;font-weight:700;font-family:'Heebo',sans-serif}
.si::placeholder{color:rgba(255,255,255,.2);font-weight:400;font-size:14px}
.si:focus{border-color:#6366f1!important;background:rgba(99,102,241,.1);box-shadow:none!important}
.s-btn{width:100%;padding:18px;border-radius:13px;border:none;font-size:18px;font-weight:800;font-family:'Heebo',sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6366f1,#4f46e5)}
.s-skip{width:100%;padding:12px;border-radius:13px;border:1.5px solid rgba(255,255,255,.1);background:transparent;font-size:14px;font-weight:600;font-family:'Heebo',sans-serif;cursor:pointer;color:rgba(255,255,255,.3);margin-top:10px}
.s-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── MAIN ── */
#main{display:none;flex-direction:column;min-height:100dvh}
#main.on{display:flex}
.page{display:none;overflow-y:auto;flex:1;padding-bottom:76px}
.page.on{display:block}

/* ── NAV ── */
nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,4px)}
nav button{flex:1;border:none;background:transparent;padding:9px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.ni{font-size:22px;line-height:1}
.nl{font-size:10px;font-weight:500;color:#94a3b8;font-family:'Heebo',sans-serif;transition:.15s}
nav button.on .nl{color:#6366f1;font-weight:700}
.nb{width:16px;height:2.5px;background:#6366f1;border-radius:2px;opacity:0;transition:.15s}
nav button.on .nb{opacity:1}

/* ── FAB ── */
#fab{position:fixed;bottom:90px;right:20px;width:58px;height:58px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:18px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:90;box-shadow:0 4px 18px rgba(99,102,241,.55);color:#fff;transition:.2s}
#fab:active{transform:scale(.9)}

/* ── BOTTOM SHEET ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;width:100%;transform:translateY(100%);background:#fff;border-radius:22px 22px 0 0;z-index:201;transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:#e2e8f0;border-radius:2px;margin:12px auto 0;flex-shrink:0}
.sheet-head{padding:16px 20px 14px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sheet-title{font-size:19px;font-weight:800;color:#1e293b}
.sheet-close{width:30px;height:30px;border-radius:50%;background:#f1f5f9;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-body{overflow-y:auto;padding:16px 20px 32px;flex:1}

/* ── TOAST ── */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-6px);background:#1e293b;color:#fff;padding:13px 24px;border-radius:22px;font-size:16px;font-weight:600;z-index:999;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── CARDS ── */
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin:0 16px 12px}
.ct{font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.cr:last-child{border-bottom:none}
.cr.b .cl,.cr.b .cv{font-size:17px;font-weight:800;color:#1e293b}
.cl{font-size:16px;color:#64748b}
.cv{font-size:16px;font-weight:600;color:#1e293b}

/* ── HERO ── */
.hero{background:linear-gradient(160deg,#1e293b,#0f172a);padding:24px 20px 28px;color:#fff}
.h-greet{font-size:14px;color:#475569;margin-bottom:3px}
.h-big{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1}
.h-sub{font-size:14px;color:#475569;margin-top:5px}

/* ── ACCOUNT CARD (tappable) ── */
.acc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);margin:0 16px 12px;cursor:pointer;transition:.15s}
.acc:active{transform:scale(.98)}
.acc-h{padding:20px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.acc-hn{font-size:14px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:2px}
.acc-hb{font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1}
.acc-hd{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px}
.acc-hi{font-size:32px;line-height:1}
.acc-body{padding:14px 20px 16px}
.acc-acts{display:flex;gap:8px}
.acc-act{flex:1;padding:13px 6px;border-radius:12px;border:none;background:#f8fafc;font-size:13px;font-weight:700;color:#334155;font-family:'Heebo',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.acc-act:active{background:#e2e8f0}
.acc-act .a-ico{font-size:22px;line-height:1}

/* ── TXN LIST ── */
.txn{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f8fafc}
.txn:last-child{border-bottom:none}
.txn-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.txn-desc{flex:1;min-width:0}
.txn-desc .td{font-size:15px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-desc .ts{font-size:13px;color:#94a3b8;margin-top:1px}
.txn-amt{font-size:16px;font-weight:800;text-align:left;white-space:nowrap}

/* ── GAIN BOX ── */
.gain{border-radius:12px;padding:12px 15px;margin-bottom:12px}
.g-l{font-size:13px;color:#64748b;margin-bottom:2px}
.g-v{font-size:26px;font-weight:900}
.g-p{font-size:14px;font-weight:700}
.g-n{font-size:11px;color:#94a3b8;margin-top:3px}

/* ── FORM INPUTS ── */
.ff{margin-bottom:14px}
.ff label{font-size:14px;font-weight:700;color:#475569;display:block;margin-bottom:6px}
.fi{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid #e2e8f0;font-size:17px;color:#1e293b;background:#fff;font-family:'Heebo',sans-serif}
.ftwo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtn{width:100%;padding:17px;border-radius:14px;border:none;font-size:17px;font-weight:800;font-family:'Heebo',sans-serif;cursor:pointer;color:#fff}

/* ── TILES ── */
.tiles{display:flex;gap:10px;padding:14px 16px 0}
.tile{flex:1;border-radius:14px;padding:12px 14px;min-width:0}
.ti{font-size:22px;margin-bottom:5px;line-height:1}
.tl{font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:2px}
.tv{font-size:19px;font-weight:900;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── SECTION HDR ── */
.shdr{font-size:14px;font-weight:700;color:#64748b;padding:14px 16px 6px;letter-spacing:.4px;text-transform:uppercase}

/* ── MONTH MINI ── */
.mm{background:#fff;border-radius:16px;padding:14px 16px;margin:0 16px 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mmg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mmb{border-radius:9px;padding:9px 11px}
.mmb-l{font-size:11px;font-weight:700;margin-bottom:2px}
.mmb-v{font-size:18px;font-weight:800}

/* ── PBAR ── */
.pbar{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin:8px 0 3px}
.pbar-f{height:100%;border-radius:3px;transition:width .6s ease}
.mst{text-align:center;font-size:14px;font-weight:700;padding:3px 0}

/* ── MONTH PICKER ── */
.mpick{background:#1e293b;padding:10px 14px;display:flex;gap:6px;overflow-x:auto}
.mpbtn{padding:10px 18px;border-radius:20px;border:none;font-family:'Heebo',sans-serif;font-size:15px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:.15s}

/* ── CAT BARS ── */
.br{margin-bottom:11px}
.br-t{display:flex;justify-content:space-between;margin-bottom:4px}
.br-n{font-size:15px;color:#334155;display:flex;align-items:center;gap:6px}
.brd{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0}
.br-a{font-size:15px;font-weight:700;color:#1e293b}
.brt{height:7px;background:#f1f5f9;border-radius:3px;overflow:hidden}
.brf{height:100%;border-radius:3px;transition:width .5s}

/* ── EMPTY ── */
.empty{padding:48px 24px;text-align:center;color:#94a3b8}
.empty-ico{font-size:44px;margin-bottom:12px}
.empty-t{font-size:18px;font-weight:600;margin-bottom:6px}
.empty-s{font-size:15px}

/* ── QUICK ACTION GRID ── */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{padding:22px 14px;border-radius:16px;border:1.5px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:'Heebo',sans-serif;transition:.15s}
.qa-btn:active{background:#f5f3ff;border-color:#6366f1}
.qa-btn .q-ico{font-size:32px;line-height:1}
.qa-btn .q-lbl{font-size:14px;font-weight:700;color:#334155;text-align:center}

/* ── SCAN ── */
.scan-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stype{padding:14px 10px;border-radius:13px;border:2px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:'Heebo',sans-serif;transition:.15s}
.stype.on{border-color:#6366f1;background:#f5f3ff}
.stype .st-i{font-size:28px;line-height:1}
.stype .st-l{font-size:13px;font-weight:700;color:#64748b}
.stype.on .st-l{color:#6366f1}
.upload-zone{border:2px dashed #cbd5e1;border-radius:14px;padding:28px 18px;text-align:center;cursor:pointer;background:#f8fafc;transition:.2s;margin-bottom:14px;display:block}
.upload-zone:active{border-color:#6366f1;background:#f5f3ff}
.uz-i{font-size:42px;margin-bottom:8px;line-height:1}
.uz-t{font-size:16px;font-weight:700;color:#334155;margin-bottom:3px}
.uz-s{font-size:13px;color:#94a3b8}
.scan-load{text-align:center;padding:28px 0}
.sp{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-res{background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:14px;margin-bottom:12px}
.sr-t{font-size:12px;font-weight:700;color:#16a34a;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.sr-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(134,239,172,.3);font-size:15px}
.sr-row:last-child{border-bottom:none}
.scan-err{background:#fff7f7;border:1.5px solid #fca5a5;border-radius:11px;padding:12px 14px;font-size:13px;color:#dc2626;margin-bottom:12px}
.txn-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.txn-row:last-child{border-bottom:none}

/* ── LOCK BOX ── */
.lockbox{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-top:10px}
.usecs{background:#1e293b;padding:10px 14px;display:flex;gap:6px;overflow-x:auto}
.usec{padding:10px 16px;border-radius:18px;border:none;font-family:'Heebo',sans-serif;font-size:14px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:.15s}

/* ── STOCKS ── */
.stk-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);margin:0 16px 12px}
.stk-hdr{padding:14px 18px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.stk-sym{font-size:18px;font-weight:900;color:#1e293b}
.stk-name{font-size:12px;color:#94a3b8;margin-top:1px}
.stk-price{text-align:left}
.stk-cur{font-size:20px;font-weight:900;color:#1e293b;letter-spacing:-.5px}
.stk-chg{font-size:12px;font-weight:700;margin-top:1px}
.stk-body{padding:10px 18px 14px;display:flex;gap:0}
.stk-stat{flex:1;padding:0 4px}
.stk-stat-l{font-size:11px;color:#94a3b8;margin-bottom:2px}
.stk-stat-v{font-size:14px;font-weight:700;color:#1e293b}
.stk-acts{display:flex;gap:8px;padding:0 18px 14px}
.stk-act{flex:1;padding:9px 6px;border-radius:10px;border:none;background:#f8fafc;font-size:12px;font-weight:700;color:#334155;font-family:'Heebo',sans-serif;cursor:pointer}
.stk-act:active{background:#e2e8f0}
.stk-loading{display:flex;align-items:center;justify-content:center;padding:12px;gap:8px;font-size:13px;color:#94a3b8}
.stk-mini-spin{width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.add-stk{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin:0 16px 12px;border:2px dashed #e2e8f0;cursor:pointer;text-align:center;color:#94a3b8;font-size:14px;font-weight:600}
.add-stk:active{background:#f5f3ff;border-color:#6366f1}
.portfolio-summary{background:linear-gradient(160deg,#1e293b,#0f172a);padding:22px 20px 26px;color:#fff}

</style>
</head>
<body>
<div id="app">
  <div id="setup" class="off"></div>
  <div id="main">
    <div id="p0" class="page on"></div>
    <div id="p1" class="page"></div>
    <div id="p2" class="page"></div>
    <div id="p3" class="page"></div>
    <div id="p4" class="page"></div>
    <div id="p5" class="page"></div>
    <nav>
      <button class="on" onclick="go(0)"><span class="ni">🏠</span><span class="nl">סקירה</span><div class="nb"></div></button>
      <button onclick="go(1)"><span class="ni">💰</span><span class="nl">חודשי</span><div class="nb"></div></button>
      <button onclick="go(2)"><span class="ni">💳</span><span class="nl">הוצאות</span><div class="nb"></div></button>
      <button onclick="go(3)"><span class="ni">📊</span><span class="nl">נכסים</span><div class="nb"></div></button>
      <button onclick="go(4)"><span class="ni">✏️</span><span class="nl">עדכון</span><div class="nb"></div></button>
      <button onclick="go(5)"><span class="ni">📈</span><span class="nl">מניות</span><div class="nb"></div></button>
    </nav>
  </div>
  <button id="fab" onclick="openSheet('qa')">＋</button>
</div>

<!-- Sheet BG -->
<div class="sheet-bg" id="sbg" onclick="closeSheet()"></div>

<!-- Sheets -->
<div class="sheet" id="sh-qa">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><span class="sheet-title">פעולה מהירה</span><button class="sheet-close" onclick="closeSheet()">✕</button></div>
  <div class="sheet-body" id="sh-qa-body"></div>
</div>

<div class="sheet" id="sh-acc">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><span class="sheet-title" id="sh-acc-title">חשבון</span><button class="sheet-close" onclick="closeSheet()">✕</button></div>
  <div class="sheet-body" id="sh-acc-body"></div>
</div>

<div class="sheet" id="sh-act">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><span class="sheet-title" id="sh-act-title">פעולה</span><button class="sheet-close" onclick="closeSheet()">✕</button></div>
  <div class="sheet-body" id="sh-act-body"></div>
</div>

<div id="toast"></div>

<script>
'use strict';
// ═══════════════ CONSTANTS ═══════════════════════════════════════════════════
const KEY = 'hakesef3';
const CC = {ביטוח:"#f97316",מסעדות:"#22c55e",מוסדות:"#3b82f6",אופנה:"#a855f7",אנרגיה:"#eab308",בריאות:"#06b6d4",מזון:"#10b981",קניות:"#ef4444",בילוי:"#38bdf8",בית:"#14b8a6",טיפוח:"#ec4899",תקשורת:"#8b5cf6",תחבורה:"#94a3b8",רכב:"#64748b",מלון:"#f59e0b",חינוך:"#60a5fa",ציוד:"#dc2626",תרומות:"#818cf8",תיירות:"#fb7185",אירועים:"#f43f5e",חיסכון:"#4ade80"};
const ACC_DEFS = {
  bank:      {name:'עו"ש',       ico:'🏦', grad:'linear-gradient(135deg,#0ea5e9,#0284c7)', liquid:true,  inv:false},
  emergency: {name:'חיסכון חירום',ico:'🛡️', grad:'linear-gradient(135deg,#16a34a,#15803d)', liquid:true,  inv:false},
  savings:   {name:'חיסכון',     ico:'🏺', grad:'linear-gradient(135deg,#8b5cf6,#7c3aed)', liquid:true,  inv:false},
  invest:    {name:'השקעות',     ico:'📈', grad:'linear-gradient(135deg,#10b981,#059669)', liquid:false, inv:true},
  pension:   {name:'פנסיה',      ico:'🏛️', grad:'linear-gradient(135deg,#4f46e5,#7c3aed)', liquid:false, inv:true},
  study:     {name:'השתלמות',    ico:'📚', grad:'linear-gradient(135deg,#0891b2,#0e7490)', liquid:false, inv:true},
  crypto:    {name:'קריפטו',     ico:'₿',  grad:'linear-gradient(135deg,#f59e0b,#d97706)', liquid:false, inv:true},
  other:     {name:'אחר',        ico:'📦', grad:'linear-gradient(135deg,#64748b,#475569)', liquid:false, inv:false},
};

// ═══════════════ STATE ═══════════════════════════════════════════════════════
let D = null;
let TAB=0, MI=null, EI=null, EALL=false, USEC='month', SS=0, SD={};
let NC={}, scanState={type:null,b64:null,isPdf:false,fileLoaded:false,fileName:'',fileSize:'',result:null,loading:false,err:null,progress:''};
let curSheet=null, actAcc=null, actType=null;

function mkD() {
  const mkAcc = (extra={}) => ({bal:0, date:'', txns:[], enabled:true, ...extra});
  return {
    v:3, income:0, name:'',
    accounts:{
      bank:      mkAcc({name:'עו"ש'}),
      emergency: mkAcc({name:'חיסכון חירום'}),
      savings:   mkAcc({name:'חיסכון'}),
      invest:    mkAcc({name:'השקעות', cost:0}),
      pension:   mkAcc({name:'פנסיה', fund:'', deposited:0, monthlyDep:0, deps:[]}),
      study:     mkAcc({name:'קרן השתלמות', fund:'', deposited:0, liquid:'', deps:[]}),
      crypto:    mkAcc({name:'קריפטו', enabled:false}),
      other:     mkAcc({name:'אחר', enabled:false}),
    },
    months:{},
  };
}

// ═══════════════ UTILS ═══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const ils = n => n==null?'—':'₪'+Math.round(+n||0).toLocaleString('he-IL');
const sgn = n => (n>=0?'+':'')+ils(n);
const pct = n => ((+n||0)*100).toFixed(1)+'%';
const catc = c => CC[c]||'#6366f1';
const mks = () => Object.keys(D.months).sort();
const today = () => new Date().toLocaleDateString('he-IL');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const num = id => parseFloat($(id)?.value)||0;
const txt = id => $(id)?.value?.trim()||'';
const sel = id => $(id)?.value||'';

function saveD(){localStorage.setItem(KEY,JSON.stringify(D));}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2300);}

// ═══════════════ BOOT ════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{
  try{const raw=localStorage.getItem(KEY);if(raw){D=JSON.parse(raw);// migrate old data
    Object.values(D.accounts).forEach(a=>{if(!a.txns)a.txns=[];});launchApp();}else{D=mkD();launchSetup();}}
  catch(e){D=mkD();launchSetup();}
});

// ═══════════════ SETUP ═══════════════════════════════════════════════════════
const STEPS=['welcome','bank','emergency','savings','invest','pension','study','extras','income','done'];
function launchSetup(){$('setup').classList.remove('off');$('main').style.display='none';SS=0;SD={};drawSetup();}
function drawSetup(){
  const dots=STEPS.map((_,i)=>`<div class="s-dot ${i<SS?'done':i===SS?'on':''}"></div>`).join('');
  const bods={
    welcome:`<div class="s-head" style="padding-top:48px"><div class="s-ico">💰</div><div class="s-title">הכסף שלי</div><div class="s-sub" style="margin-top:8px;font-size:15px;line-height:1.65">ניהול פיננסי מלא — כמו אפליקציית בנק, אבל לכל החשבונות שלך ביחד.</div></div><div class="s-body"></div><div class="s-foot"><button class="s-btn" onclick="SS++;drawSetup()">מתחילים 🚀</button><p style="text-align:center;margin-top:12px;font-size:11px;color:#334155">הכל נשמר אצלך בטלפון בלבד</p></div>`,
    bank:`<div class="s-head"><div class="s-ico">🏦</div><div class="s-title">עו"ש — כמה יש עכשיו?</div><div class="s-sub">יתרה בחשבון הבנק הראשי</div></div><div class="s-body"><div class="sf"><label>שם הבנק</label><input class="si" id="w-bn" placeholder='בנק הפועלים' value="${SD.bn||''}"></div><div class="sf"><label>יתרה עכשיו ₪</label><input class="si" id="w-bb" type="number" inputmode="numeric" placeholder="0" value="${SD.bb||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('bank')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    emergency:`<div class="s-head"><div class="s-ico">🛡️</div><div class="s-title">חיסכון חירום</div><div class="s-sub">כסף בצד לימים קשים — נפרד מהעו"ש</div></div><div class="s-body"><div class="sf"><label>איפה שמור?</label><input class="si" id="w-en" placeholder="פיקדון / חיסכון" value="${SD.en||''}"></div><div class="sf"><label>סכום ₪</label><input class="si" id="w-eb" type="number" inputmode="numeric" placeholder="0" value="${SD.eb||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('emergency')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    savings:`<div class="s-head"><div class="s-ico">🏺</div><div class="s-title">חיסכון כללי</div><div class="s-sub">לטווח בינוני — רכב, חתונה, דירה...</div></div><div class="s-body"><div class="sf"><label>איפה שמור?</label><input class="si" id="w-sn" placeholder="פיקדון / גמל להשקעה" value="${SD.sn||''}"></div><div class="sf"><label>סכום ₪</label><input class="si" id="w-sb" type="number" inputmode="numeric" placeholder="0" value="${SD.sb||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('savings')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    invest:`<div class="s-head"><div class="s-ico">📈</div><div class="s-title">תיק השקעות</div><div class="s-sub">מניות, קרנות, ETF</div></div><div class="s-body"><div class="sf"><label>איפה מנוהל?</label><input class="si" id="w-in" placeholder="מיטב / IBI / אחר" value="${SD.in_||''}"></div><div class="s-two"><div class="sf"><label>שווי נוכחי ₪</label><input class="si" id="w-ib" type="number" inputmode="numeric" placeholder="0" value="${SD.ib||''}"></div><div class="sf"><label>עלות שהפקדתי ₪</label><input class="si" id="w-ic" type="number" inputmode="numeric" placeholder="0" value="${SD.ic||''}"></div></div></div><div class="s-foot"><button class="s-btn" onclick="wS('invest')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    pension:`<div class="s-head"><div class="s-ico">🏛️</div><div class="s-title">קרן פנסיה</div></div><div class="s-body"><div class="sf"><label>שם הקרן</label><input class="si" id="w-pf" placeholder="הראל / מנורה / מגדל..." value="${SD.pf||''}"></div><div class="s-two"><div class="sf"><label>יתרה ₪</label><input class="si" id="w-pb" type="number" inputmode="numeric" placeholder="0" value="${SD.pb||''}"></div><div class="sf"><label>סה"כ הפקדתי ₪</label><input class="si" id="w-pd" type="number" inputmode="numeric" placeholder="0" value="${SD.pd||''}"></div></div><div class="sf"><label>הפקדה חודשית ₪</label><input class="si" id="w-pm" type="number" inputmode="numeric" placeholder="2291" value="${SD.pm||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('pension')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    study:`<div class="s-head"><div class="s-ico">📚</div><div class="s-title">קרן השתלמות</div></div><div class="s-body"><div class="sf"><label>שם הקרן</label><input class="si" id="w-sf" placeholder="מנורה / הראל..." value="${SD.sf||''}"></div><div class="s-two"><div class="sf"><label>יתרה ₪</label><input class="si" id="w-stb" type="number" inputmode="numeric" placeholder="0" value="${SD.stb||''}"></div><div class="sf"><label>סה"כ הפקדתי ₪</label><input class="si" id="w-std" type="number" inputmode="numeric" placeholder="0" value="${SD.std||''}"></div></div><div class="sf"><label>תאריך נזילות</label><input class="si" id="w-stl" placeholder="31/03/2031" value="${SD.stl||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('study')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    extras:`<div class="s-head"><div class="s-ico">➕</div><div class="s-title">עוד נכסים?</div><div class="s-sub">קריפטו, כסף שחייבים לך...</div></div><div class="s-body"><div class="sf"><label>קריפטו ₪</label><input class="si" id="w-cry" type="number" inputmode="numeric" placeholder="0" value="${SD.cry||''}"></div><div class="sf"><label>אחר (שם)</label><input class="si" id="w-on" placeholder="הלוואה שנתתי..." value="${SD.on_||''}"></div><div class="sf"><label>אחר (סכום ₪)</label><input class="si" id="w-ob" type="number" inputmode="numeric" placeholder="0" value="${SD.ob||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('extras')">המשך →</button><button class="s-skip" onclick="SS++;drawSetup()">דלג</button></div>`,
    income:`<div class="s-head"><div class="s-ico">💼</div><div class="s-title">כמה אתה מרוויח?</div><div class="s-sub">משכורת חודשית נטו — לחישוב חיסכון</div></div><div class="s-body"><div class="sf"><label>משכורת חודשית נטו ₪</label><input class="si" id="w-inc" type="number" inputmode="numeric" placeholder="10000" value="${SD.inc||''}"></div></div><div class="s-foot"><button class="s-btn" onclick="wS('income')">סיום ✓</button></div>`,
    done:()=>{
      const total=Object.values(D.accounts).reduce((s,a)=>s+(+a.bal||0),0);
      const rows=Object.entries(D.accounts).filter(([,a])=>(+a.bal||0)>0).map(([k,a])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)"><span style="font-size:13px;color:rgba(255,255,255,.5)">${ACC_DEFS[k].ico} ${a.name}</span><span style="font-size:13px;font-weight:700;color:#a5b4fc">${ils(a.bal)}</span></div>`).join('');
      return `<div class="s-head" style="padding-top:52px;text-align:center"><div class="s-ico" style="text-align:center">🎉</div><div class="s-title">הכל מוגדר!</div><div class="s-sub" style="margin-top:8px">מעכשיו אתה מנהל את כל הכסף שלך ממקום אחד.</div></div><div class="s-body"><div style="background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);border-radius:14px;padding:14px 16px;margin-top:8px">${rows}<div style="display:flex;justify-content:space-between;padding:10px 0 0"><span style="font-size:14px;font-weight:700;color:rgba(255,255,255,.75)">סה"כ נכסים</span><span style="font-size:18px;font-weight:900;color:#6366f1">${ils(total)}</span></div></div></div><div class="s-foot"><button class="s-btn" onclick="finishSetup()">כנס לאפליקציה →</button></div>`;
    },
  };
  $('setup').innerHTML=`<div class="s-prog">${dots}</div>${typeof bods[STEPS[SS]]==='function'?bods[STEPS[SS]]():bods[STEPS[SS]]||''}`;
}

function wS(step){
  const d=today(), a=D.accounts;
  if(step==='bank'){const n=txt('w-bn'),b=num('w-bb');if(n)a.bank.name=n;a.bank.bal=b;a.bank.date=d;SD.bn=n;SD.bb=b;}
  else if(step==='emergency'){const n=txt('w-en'),b=num('w-eb');if(n)a.emergency.name=n;a.emergency.bal=b;a.emergency.date=d;SD.en=n;SD.eb=b;}
  else if(step==='savings'){const n=txt('w-sn'),b=num('w-sb');if(n)a.savings.name=n;a.savings.bal=b;a.savings.date=d;SD.sn=n;SD.sb=b;}
  else if(step==='invest'){const n=txt('w-in'),b=num('w-ib'),c=num('w-ic');if(n)a.invest.name=n;a.invest.bal=b;a.invest.cost=c;a.invest.date=d;SD.in_=n;SD.ib=b;SD.ic=c;}
  else if(step==='pension'){const f=txt('w-pf'),b=num('w-pb'),dep=num('w-pd'),m=num('w-pm');if(f)a.pension.fund=f;a.pension.bal=b;a.pension.deposited=dep;a.pension.monthlyDep=m;a.pension.date=d;SD.pf=f;SD.pb=b;SD.pd=dep;SD.pm=m;}
  else if(step==='study'){const f=txt('w-sf'),b=num('w-stb'),dep=num('w-std'),l=txt('w-stl');if(f)a.study.fund=f;a.study.bal=b;a.study.deposited=dep;a.study.liquid=l;a.study.date=d;SD.sf=f;SD.stb=b;SD.std=dep;SD.stl=l;}
  else if(step==='extras'){const cry=num('w-cry'),on_=txt('w-on'),ob=num('w-ob');if(cry>0){a.crypto.bal=cry;a.crypto.enabled=true;a.crypto.date=d;}if(ob>0){a.other.bal=ob;if(on_)a.other.name=on_;a.other.enabled=true;a.other.date=d;}SD.cry=cry;SD.on_=on_;SD.ob=ob;}
  else if(step==='income'){D.income=num('w-inc');SD.inc=D.income;saveD();}
  SS++;drawSetup();
}
function finishSetup(){saveD();$('setup').classList.add('off');launchApp();}

// ═══════════════ APP ═════════════════════════════════════════════════════════
function launchApp(){
  if (!D.stocks) D.stocks = [];
  $('main').style.display='flex';$('main').style.flexDirection='column';$('main').style.minHeight='100dvh';go(0);
}

function go(i){
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',j===i));
  document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j===i));
  TAB=i;
  if(i===0)drawHome();if(i===1)drawMonthly();if(i===2)drawExpenses();if(i===3)drawAssets();if(i===4)drawUpdate();if(i===5)drawStocks();
}

// ═══════════════ SHEETS ══════════════════════════════════════════════════════
function openSheet(id){
  closeSheet(true);
  curSheet=id;
  $('sbg').classList.add('on');
  $('sh-'+id).classList.add('on');
  if(id==='qa')drawQA();
}
function closeSheet(silent){
  if(curSheet){$('sh-'+curSheet)?.classList.remove('on');}
  $('sbg').classList.remove('on');
  curSheet=null;
  if(!silent){}
}

// ─── Quick Actions ─────────────────────────────────────────────────────────
function drawQA(){
  $('sh-qa-body').innerHTML=`
    <div class="qa-grid">
      <button class="qa-btn" onclick="openAct('transfer',null)"><span class="q-ico">↔️</span><span class="q-lbl">העברה בין חשבונות</span></button>
      <button class="qa-btn" onclick="openAct('income_add',null)"><span class="q-ico">💼</span><span class="q-lbl">הוספת הכנסה</span></button>
      <button class="qa-btn" onclick="openAct('expense_add',null)"><span class="q-ico">🧾</span><span class="q-lbl">הוספת הוצאה</span></button>
      <button class="qa-btn" onclick="openAct('deposit','savings')"><span class="q-ico">🏺</span><span class="q-lbl">הפקדה לחיסכון</span></button>
      <button class="qa-btn" onclick="openAct('deposit','emergency')"><span class="q-ico">🛡️</span><span class="q-lbl">הפקדה לחירום</span></button>
      <button class="qa-btn" onclick="openAct('deposit','invest')"><span class="q-ico">📈</span><span class="q-lbl">הפקדה להשקעות</span></button>

}

// ─── Account detail sheet ──────────────────────────────────────────────────
function showAcc(key){
  actAcc=key;
  const a=D.accounts[key];
  const def=ACC_DEFS[key];
  $('sh-acc-title').textContent=`${def.ico} ${a.name}`;
  const isInv=def.inv;
  const gain=isInv?(a.bal-(a.deposited||a.cost||0)):null;
  const gainPct=gain!==null&&(a.deposited||a.cost)>0?gain/(a.deposited||a.cost):null;

  const txns=(a.txns||[]).slice().reverse().slice(0,30);
  const txnHtml=txns.length?txns.map(t=>{
    const isC=t.type==='credit';
    return `<div class="txn">
      <div class="txn-ico" style="background:${isC?'#f0fdf4':'#fff7f7'}">${isC?'⬆️':'⬇️'}</div>
      <div class="txn-desc"><div class="td">${t.desc||''}</div><div class="ts">${t.date||''}</div></div>
      <div class="txn-amt" style="color:${isC?'#16a34a':'#dc2626'}">${isC?'+':''}${ils(t.amount)}</div>
    </div>`;}).join(''):`<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px">אין תנועות עדיין</div>`;

  const actBtns=`<div style="display:flex;gap:8px;margin-bottom:16px">
    ${key==='bank'?`<button class="acc-act" style="flex:1;padding:12px 8px" onclick="openAct('income_add','bank')"><span class="a-ico">➕</span>הכנסה</button>`:''}
    ${def.liquid?`<button class="acc-act" style="flex:1;padding:12px 8px" onclick="openAct('deposit','${key}')"><span class="a-ico">⬇️</span>הפקד</button>
    <button class="acc-act" style="flex:1;padding:12px 8px" onclick="openAct('withdraw','${key}')"><span class="a-ico">⬆️</span>משוך</button>`:''}
    <button class="acc-act" style="flex:1;padding:12px 8px" onclick="openAct('transfer','${key}')"><span class="a-ico">↔️</span>העבר</button>
    ${isInv?`<button class="acc-act" style="flex:1;padding:12px 8px" onclick="openAct('update_bal','${key}')"><span class="a-ico">🔄</span>עדכן</button>`:''}
  </div>`;

  const gainHtml=gain!==null&&(a.deposited||a.cost)>0?`
    <div class="gain" style="background:${gain>=0?'#f0fdf4':'#fff7f7'};border:1.5px solid ${gain>=0?'#86efac':'#fca5a5'}">
      <div class="g-l">💡 תשואה על ההפקדות שלך</div>
      <div class="g-v" style="color:${gain>=0?'#16a34a':'#dc2626'}">${sgn(gain)}</div>
      ${gainPct!==null?`<div class="g-p" style="color:${gain>=0?'#16a34a':'#dc2626'}">${pct(gainPct)}</div>`:''}
    </div>`:'';

  const extraHtml=key==='pension'&&a.monthlyDep?`<div class="cr"><span class="cl">הפקדה חודשית</span><span class="cv">${ils(a.monthlyDep)}</span></div>`:
    key==='study'&&a.liquid?`<div class="lockbox" style="background:#fffbeb;border:1.5px solid #fcd34d"><span style="font-size:20px">🔒</span><div style="font-size:13px;font-weight:700;color:#92400e">נזיל מ-${a.liquid}</div></div>`:
    key==='invest'&&a.cost?`<div class="cr"><span class="cl">עלות</span><span class="cv">${ils(a.cost)}</span></div>`:'';

  $('sh-acc-body').innerHTML=`
    <div style="border-radius:16px;padding:18px;margin-bottom:14px;${def.grad?'background:'+def.grad:''}">
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:3px">${a.name}</div>
      <div style="font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px">${ils(a.bal)}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:3px">עדכון: ${a.date||'—'}</div>
    </div>
    ${gainHtml}
    ${(a.deposited||a.cost)?`<div class="card" style="margin:0 0 12px"><div class="cr"><span class="cl">סה"כ הופקד</span><span class="cv">${ils(a.deposited||a.cost)}</span></div>${extraHtml}</div>`:''}
    ${actBtns}
    <div style="font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase">תנועות אחרונות</div>
    ${txnHtml}`;

  openSheet('acc');
}

// ─── Action sheet ──────────────────────────────────────────────────────────
function openAct(type, acc){
  actType=type; if(acc)actAcc=acc;
  closeSheet(true);
  const titles={transfer:'העברה בין חשבונות',deposit:'הפקדה',withdraw:'משיכה',income_add:'הוספת הכנסה',expense_add:'הוספת הוצאה',update_bal:'עדכון יתרה'};
  $('sh-act-title').textContent=titles[type]||'פעולה';
  $('sh-act-body').innerHTML=renderAct(type,acc);
  curSheet='act';
  $('sbg').classList.add('on');
  $('sh-act').classList.add('on');
}

function accOptions(exclude){
  return Object.entries(D.accounts).filter(([k,a])=>k!==exclude&&(+a.bal>0||k==='bank'||k==='savings'||k==='emergency')&&(a.enabled!==false)).map(([k,a])=>`<option value="${k}">${ACC_DEFS[k].ico} ${a.name} (${ils(a.bal)})</option>`).join('');
}

function renderAct(type, acc){
  const a=acc?D.accounts[acc]:null;
  if(type==='transfer'){
    return `
      <div class="ff"><label>מ-חשבון</label><select class="fi" id="a-from">${accOptions('__')}</select></div>
      <div class="ff"><label>ל-חשבון</label><select class="fi" id="a-to">${accOptions('__')}</select></div>
      <div class="ff"><label>סכום ₪</label><input class="fi" id="a-amt" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="ff"><label>הערה (אופציונלי)</label><input class="fi" id="a-desc" placeholder="הפקדה לחיסכון..."></div>
      <button class="fbtn" onclick="execTransfer()" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">העבר ✓</button>`;
  }
  if(type==='deposit'){
    return `
      <div style="font-size:13px;color:#64748b;margin-bottom:14px">הפקדה אל: <strong>${a?a.name:''}</strong></div>
      <div class="ff"><label>מ-חשבון (מקור)</label><select class="fi" id="a-from">${accOptions(acc)}</select></div>

// ─── Exec actions ──────────────────────────────────────────────────────────
function addTxn(accKey, type, amount, desc, relatedAcc){
  const a=D.accounts[accKey];
  if(!a.txns)a.txns=[];
  a.txns.push({id:uid(), date:today(), type, amount:+amount, desc, relatedAcc:relatedAcc||null, balAfter:a.bal});
  // Keep last 200 txns
  if(a.txns.length>200)a.txns=a.txns.slice(-200);
}

function execTransfer(){
  const from=sel('a-from'), to=sel('a-to'), amt=num('a-amt'), desc=txt('a-desc')||'העברה';
  if(!from||!to||!amt){toast('מלא את כל השדות');return;}
  if(from===to){toast('בחר חשבונות שונים');return;}
  const fAcc=D.accounts[from], tAcc=D.accounts[to];
  if(fAcc.bal<amt){toast('אין מספיק יתרה');return;}
  fAcc.bal-=amt; tAcc.bal+=amt;
  addTxn(from,'debit',amt,`${desc} → ${tAcc.name}`,to);
  addTxn(to,'credit',amt,`${desc} ← ${fAcc.name}`,from);
  fAcc.date=today(); tAcc.date=today();
  saveD(); closeSheet(); toast('העברה בוצעה ✓'); go(TAB);
}

function execDeposit(toKey){
  const from=sel('a-from'), amt=num('a-amt'), desc=txt('a-desc')||'הפקדה';
  if(!from||!amt){toast('מלא סכום');return;}
  const fAcc=D.accounts[from], tAcc=D.accounts[toKey];
  if(from!='external'&&fAcc.bal<amt){toast('אין מספיק יתרה בחשבון המקור');return;}
  if(from!=='external'){fAcc.bal-=amt;addTxn(from,'debit',amt,`${desc} → ${tAcc.name}`,toKey);fAcc.date=today();}
  tAcc.bal+=amt;
  addTxn(toKey,'credit',amt,desc,from);
  tAcc.date=today();
  saveD(); closeSheet(); toast('הפקדה בוצעה ✓'); go(TAB);
}

function execWithdraw(fromKey){
  const to=sel('a-to'), amt=num('a-amt'), desc=txt('a-desc')||'משיכה';
  if(!amt){toast('מלא סכום');return;}
  const fAcc=D.accounts[fromKey];
  if(fAcc.bal<amt){toast('אין מספיק יתרה');return;}
  fAcc.bal-=amt; addTxn(fromKey,'debit',amt,desc,to); fAcc.date=today();
  if(to){const tAcc=D.accounts[to];tAcc.bal+=amt;addTxn(to,'credit',amt,`${desc} ← ${fAcc.name}`,fromKey);tAcc.date=today();}
  saveD(); closeSheet(); toast('משיכה בוצעה ✓'); go(TAB);
}

function execIncome(){
  const to=sel('a-to'), amt=num('a-amt'), desc=txt('a-desc')||'הכנסה';
  if(!to||!amt){toast('מלא את כל השדות');return;}
  const tAcc=D.accounts[to];
  tAcc.bal+=amt; addTxn(to,'credit',amt,desc,null); tAcc.date=today();
  saveD(); closeSheet(); toast('הכנסה נרשמה ✓'); go(TAB);
}

function execExpense(){
  const from=sel('a-from'), amt=num('a-amt'), desc=txt('a-desc')||'הוצאה', cat=sel('a-cat')||'אחר';
  if(!from||!amt){toast('מלא את כל השדות');return;}
  const fAcc=D.accounts[from];
  fAcc.bal-=amt; addTxn(from,'debit',amt,`${desc} (${cat})`,null); fAcc.date=today();
  saveD(); closeSheet(); toast('הוצאה נרשמה ✓'); go(TAB);
}

function execUpdateBal(key){
  const a=D.accounts[key], amt=num('a-amt'), dep=$('a-dep')?num('a-dep'):null;
  if(!amt){toast('מלא יתרה');return;}
  const diff=amt-a.bal;
  a.bal=amt; a.date=today();
  if(dep!==null)a.deposited=dep;
  if(diff!==0)addTxn(key,diff>0?'credit':'debit',Math.abs(diff),'עדכון יתרה',null);
  saveD(); closeSheet(); toast('יתרה עודכנה ✓'); go(TAB);
}

const SCAN_TYPES=[{k:'pension',ico:'🏛️',lbl:'פנסיה'},{k:'study',ico:'📚',lbl:'קרן השתלמות'},{k:'bank',ico:'🏦',lbl:'תנועות עו"ש'},{k:'cc',ico:'💳',lbl:'כרטיס אשראי'}];

    ${st.loading?loadHtml:''}${errHtml}${resHtml}
    ${!st.loading&&st.type&&st.fileLoaded&&!st.result?`<button onclick="runScan()" class="fbtn" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">🔍 נתח מסמך</button>`:''}
  </div>`;

function setST(t){scanState.type=t;scanState.result=null;scanState.err=null;drawUpdate();}

function onSF(input){
  const file=input.files[0];if(!file)return;
  const sizeMB=(file.size/1024/1024).toFixed(1);
  if(file.size>30*1024*1024){scanState.err='קובץ גדול מדי (מקסימום 30MB)';drawUpdate();return;}
  const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
  const reader=new FileReader();
  reader.onload=e=>{
    const b64=e.target.result.split(',')[1];
    if(isPdf){scanState.isPdf=true;scanState.img=null;scanState.b64=b64;}
    else{resizeImg(e.target.result,1600,out=>{scanState.isPdf=false;scanState.img=out.full;scanState.b64=out.data;});}
    scanState.fileLoaded=true;scanState.fileName=file.name;scanState.fileSize=sizeMB+' MB';scanState.result=null;scanState.err=null;drawUpdate();
  };reader.readAsDataURL(file);
}

function resizeImg(dataUrl,maxPx,cb){
  const img=new Image();img.onload=()=>{const scale=Math.min(1,maxPx/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const out=canvas.toDataURL('image/jpeg',.9);cb({full:out,data:out.split(',')[1]});};img.src=dataUrl;
}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('טעינה נכשלה: '+src));document.head.appendChild(s);});}

async function extractPDFText(b64){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    setP(`קורא עמוד ${i}/${pdf.numPages}...`);
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const byY={};content.items.forEach(item=>{const y=Math.round(item.transform[5]);if(!byY[y])byY[y]=[];byY[y].push(item.str);});
    text+=Object.keys(byY).sort((a,b)=>b-a).map(y=>byY[y].join(' ')).join('\n')+'\n';
  }
  return text;
}

async function extractImageText(b64){
  setP('טוען OCR...');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  setP('מוריד עברית (פעם ראשונה ~4MB)...');
  const worker=await Tesseract.createWorker('heb+eng',1,{
    workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
    corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd-lstm.wasm.js',
    langPath:'https://tessdata.projectnaptha.com/4.0.0_fast',
    logger:m=>{if(m.status==='recognizing text')setP(`מזהה טקסט: ${Math.round(m.progress*100)}%`);}
  });
  const{data:{text}}=await worker.recognize('data:image/jpeg;base64,'+b64);
  await worker.terminate();return text;
}

function setP(msg){scanState.progress=msg;const el=$('sprog');if(el)el.textContent=msg;}

function parseNum(s){if(!s)return 0;return parseFloat(String(s).replace(/,/g,'').replace(/[^\d.]/g,''))||0;}
function findNums(text,keywords,w=250){const res=[];for(const kw of keywords){let idx=0;while((idx=text.indexOf(kw,idx))!==-1){const chunk=text.substring(idx,idx+w);[...chunk.matchAll(/[\d,]+\.?\d*/g)].forEach(m=>{const n=parseNum(m[0]);if(n>0)res.push(n);});idx+=kw.length;}}return res;}
function findDate(text,keywords){for(const kw of keywords){const idx=text.indexOf(kw);if(idx===-1)continue;const chunk=text.substring(Math.max(0,idx-10),idx+120);const m=chunk.match(/(\d{2})[./](\d{2})[./](\d{2,4})/);if(m)return`${m[1]}/${m[2]}/${m[3].length===2?'20'+m[3]:m[3]}`;}const m=text.match(/(\d{2})[./](\d{2})[./](\d{4})/);return m?`${m[1]}/${m[2]}/${m[3]}`:''; }

function smartParse(text,docType){
  const t=text;const FUNDS=['הראל','מנורה','מגדל','כלל','מיטב','הפניקס','אלטשולר','פסגות','ילין לפידות'];const BANKS=['הפועלים','לאומי','דיסקונט','מזרחי','פאגי','ירושלים','מרכנתיל'];
  if(docType==='pension'){
    const fund=FUNDS.find(f=>t.includes(f))||'';
    const balance=findNums(t,['יתרת החיסכון המצטבר','יתרה ל-','יתרה כוללת','סה"כ יתרה']).find(n=>n>500)||0;
    const employee_total=findNums(t,['תגמולי עובד','תגמולי עמית','מרכיב תגמולים - עמית'],300).filter(n=>n>500&&n<500000).sort((a,b)=>b-a)[0]||0;
    const empr=findNums(t,['תגמולי מעסיק'],300).filter(n=>n>500&&n<500000).sort((a,b)=>b-a)[0]||0;
    const sev=findNums(t,['מרכיב פיצויים','פיצויים'],300).filter(n=>n>500&&n<500000).sort((a,b)=>b-a)[0]||0;
    const employer_total=empr+sev;
    const monthly_employee=findNums(t,['תגמולי עובד'],80).find(n=>n>100&&n<5000)||0;
    const monthly_employer=findNums(t,['תגמולי מעסיק'],80).find(n=>n>100&&n<10000)||0;
    const balance_date=findDate(t,['יתרת החיסכון','יתרה ל-','נכון ל']);
    const recent_deposits=[];
    t.split('\n').filter(l=>/\d{2}[./]\d{2}[./]\d{4}/.test(l)&&/\d{3,}/.test(l)).slice(0,6).forEach(line=>{const dm=line.match(/(\d{2})[./](\d{2})[./](\d{4})/);const nums=[...line.matchAll(/[\d,]+\.?\d*/g)].map(m=>parseNum(m[0])).filter(n=>n>100&&n<50000);if(dm&&nums.length>=2)recent_deposits.push({date:`${dm[1]}/${dm[2]}/${dm[3]}`,label:'',employee:nums[0],employer:nums[1]});});
    return{type:'pension',fund,balance,balance_date,employee_total,employer_total,monthly_employee,monthly_employer,recent_deposits};
  }
  if(docType==='study'){
    const fund=FUNDS.find(f=>t.includes(f))||'';
    const balance=findNums(t,['סך צבירה','יתרה','צבירה כוללת','סה"כ בש"ח'],200).filter(n=>n>500).sort((a,b)=>b-a)[0]||0;
    const employee_total=findNums(t,['תגמולי עובד'],300).filter(n=>n>200&&n<500000).sort((a,b)=>b-a)[0]||0;
    const employer_total=findNums(t,['תגמולי מעסיק'],300).filter(n=>n>200&&n<500000).sort((a,b)=>b-a)[0]||0;
    const liquid_date=findDate(t,['תאריך נזילות','נזיל','ניתן למשיכה']);
    const balance_date=findDate(t,['נכון ל','נתונים ל']);
    return{type:'study',fund,balance,balance_date,employee_total,employer_total,liquid_date};
  }
  if(docType==='bank'){
    const account=BANKS.find(b=>t.includes(b))||'בנק';const transactions=[];
    t.split('\n').forEach(line=>{const dm=line.match(/(\d{2})[./](\d{2})[./](\d{2,4})/);if(!dm)return;const date=`${dm[1]}/${dm[2]}/${dm[3].length===2?'20'+dm[3]:dm[3]}`;const allNums=[...line.matchAll(/[\d,]+\.?\d*/g)].map(m=>parseNum(m[0])).filter(n=>n>0);if(allNums.length<1)return;const desc=line.replace(/[\d,./\-+]+/g,' ').replace(/\s+/g,' ').trim();if(desc.length<2)return;const isDebit=/חובה/.test(line)||(!(/זכות/.test(line))&&/[-–]/.test(line));const amount=allNums.find(n=>n>0.5&&n<500000)||0;const balance=allNums.find(n=>n>amount&&n<10000000)||null;if(amount>0)transactions.push({date,desc:desc.substring(0,40),debit:isDebit?amount:null,credit:isDebit?null:amount,balance});});
    return{type:'bank',account,transactions:transactions.slice(0,200)};
  }
  if(docType==='cc'){
    const CARDS=['מאסטרקארד','ויזה','דיינרס','אמריקן אקספרס','ישראכרט'];const card=CARDS.find(c=>t.includes(c))||'כרטיס אשראי';
    const total=findNums(t,['סך הכל לחיוב','סה"כ לחיוב','לחיוב:'],100).find(n=>n>100)||0;
    const billing_date=findDate(t,['לחיוב ב','תאריך חיוב','עסקאות לחיוב']);
    const transactions=[];
    t.split('\n').forEach(line=>{const dm=line.match(/(\d{2})[./](\d{2})[./](\d{2,4})/);if(!dm)return;const date=`${dm[1]}/${dm[2]}/${dm[3].length===2?'20'+dm[3]:dm[3]}`;const nums=[...line.matchAll(/[\d,]+\.?\d*/g)].map(m=>parseNum(m[0])).filter(n=>n>0.5&&n<100000);if(!nums.length)return;const merchant=line.replace(/[\d,./\-+%]+/g,' ').replace(/\s+/g,' ').trim().substring(0,35);if(merchant.length<2)return;const amount=nums.find(n=>n>0.5&&n<50000)||0;if(amount>0)transactions.push({date,merchant,amount,category:autoCat(merchant)});});
    return{type:'cc',card,billing_date,total:total||transactions.reduce((s,t)=>s+t.amount,0),transactions:transactions.slice(0,200)};
  }
  return null;
}

function autoCat(m){m=(m||'').toLowerCase();if(/ספייס|מסעד|שף|pizza|burger|cafe|קפה|אוכל|food|rest|dining/.test(m))return'מסעדות';if(/שופרסל|רמי לוי|ויקטורי|מגה|מחסני|סופר|super|carrefour|קארפור|fresh/.test(m))return'מזון';if(/aliexpress|amazon|ebay|shop|חנות|stores|factory/.test(m))return'קניות';if(/ביטוח|insurance|מנורה|הראל|מגדל|כלל/.test(m))return'ביטוח';if(/בריאות|רפואה|מרפאה|hospital|קופת חולים|כללית|מכבי|leumit|pharma|אפותיקה/.test(m))return'בריאות';if(/ten |דלק|פז|סונול|אנרגיה|חשמל|electric|energy/.test(m))return'אנרגיה';if(/רכבת|אגד|דן|מונית|taxi|uber|bolt|gett|אוטובוס/.test(m))return'תחבורה';if(/מוסך|car|renault|toyota|hyundai|kia|garage/.test(m))return'רכב';if(/spotify|netflix|disney|apple|google play|yes|hot|cinema|סרט|קולנוע/.test(m))return'בילוי';if(/zara|h&m|mango|next|castro|gap|אופנה|fashion|cloth|בגד/.test(m))return'אופנה';if(/ikea|home|homecenter|ריהוט|כלים|מטבח/.test(m))return'בית';if(/cellcom|hot mobile|partner|yes|bezeq|סלקום|פרטנר|סלולר|internet/.test(m))return'תקשורת';if(/pharma|אפותיקה|טיפוח|קוסמטיק|beauty|hair|salon|ספר/.test(m))return'טיפוח';if(/hotel|מלון|airbnb|booking|hostel/.test(m))return'מלון';if(/עירייה|ממשלה|court|רישיון|מוסדות/.test(m))return'מוסדות';if(/תרומ|donation|charity|עמות/.test(m))return'תרומות';if(/חינוך|school|university|college|קורס/.test(m))return'חינוך';return'אחר';}

async function runScan(){
  if(!scanState.b64){scanState.err='יש להעלות קובץ';drawUpdate();return;}
  if(!scanState.type){scanState.err='יש לבחור סוג מסמך';drawUpdate();return;}
  scanState.loading=true;scanState.err=null;scanState.result=null;scanState.progress='מתחיל...';drawUpdate();
  try{
    let text;
    if(scanState.isPdf){setP('קורא PDF...');text=await extractPDFText(scanState.b64);}
    else{setP('מפעיל OCR...');text=await extractImageText(scanState.b64);}
    setP('מנתח נתונים...');await new Promise(r=>setTimeout(r,80));
    const result=smartParse(text,scanState.type);
    if(!result)throw new Error('לא זוהו נתונים. נסה סוג מסמך אחר.');
    if(!result.balance&&!(result.transactions||[]).length)throw new Error('לא נמצאו מספרים. ודא שהקובץ ברור.');
    scanState.result=result;scanState.loading=false;drawUpdate();
  }catch(e){scanState.loading=false;scanState.err=e.message||'שגיאה';drawUpdate();}
}

let stockCache = {};
let stockLoading = new Set();

async function fetchPrice(sym) {
  if (stockLoading.has(sym)) return;
  stockLoading.add(sym);
  if (TAB === 5) drawStocks();

  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`;
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`,
    yahooUrl, // direct last
  ];

  let json = null;
  for (const url of proxies) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) continue;
      const text = await r.text();
      json = JSON.parse(text);
      if (json?.chart?.result?.[0]?.meta) break; // success
      json = null;
    } catch { continue; }
  }

  try {
    const meta = json?.chart?.result?.[0]?.meta;
    if (!meta) throw new Error('not found');
    const price     = meta.regularMarketPrice || meta.previousClose || 0;
    const prev      = meta.chartPreviousClose || meta.previousClose || price;
    const change    = price - prev;
    const changePct = prev > 0 ? (change / prev) * 100 : 0;
    stockCache[sym] = {
      price, change, changePct,
      high:     meta.regularMarketDayHigh || price,
      low:      meta.regularMarketDayLow  || price,
      volume:   meta.regularMarketVolume  || 0,
      name:     meta.shortName || meta.longName || sym,
      currency: meta.currency || 'USD',
      ts: Date.now(), err: false
    };
  } catch(e) {
    stockCache[sym] = {
      price:0, change:0, changePct:0, high:0, low:0,
      volume:0, name:sym, currency:'', ts:Date.now(), err:true
    };
  }
  stockLoading.delete(sym);
  if (TAB === 5) drawStocks();
}

function fmtP(n, cur) {
  if (!n && n !== 0) return '—';
  const s = cur === 'ILS' ? '₪' : cur === 'GBP' ? '£' : cur === 'EUR' ? '€' : '$';
  return s + (+n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtVol(n) {
  if (!n) return '—';
  if (n>=1e9) return (n/1e9).toFixed(1)+'B';
  if (n>=1e6) return (n/1e6).toFixed(1)+'M';
  if (n>=1e3) return (n/1e3).toFixed(0)+'K';
  return ''+n;
}

function drawStocks() {
  if (!D.stocks) D.stocks = [];
  const stocks = D.stocks;

  // Kick off fetches for stale/missing
  stocks.forEach(s => {
    const c = stockCache[s.sym];
    if (!c || (!stockLoading.has(s.sym) && Date.now() - c.ts > 90000)) fetchPrice(s.sym);
  });

  // Totals
  let totalValue = 0, totalCost = 0;
  stocks.forEach(s => {
    const price = stockCache[s.sym]?.price || 0;
    totalValue += price * (s.shares || 0);
    totalCost  += (s.avgCost||0) * (s.shares||0);
  });
  const totalGain    = totalValue - totalCost;
  const totalGainPct = totalCost > 0 ? totalGain/totalCost*100 : 0;

  // Header
  const hdr = stocks.length
    ? `<div class="portfolio-summary">
        <div style="font-size:13px;color:#94a3b8;margin-bottom:3px">שווי תיק</div>
        <div style="font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1;color:#fff">
          ${totalValue > 0 ? '$'+totalValue.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}
        </div>
        ${totalCost>0 ? `<div style="margin-top:8px;display:flex;gap:10px;align-items:center">
          <span style="font-size:15px;font-weight:800;color:${totalGain>=0?'#4ade80':'#f87171'}">${totalGain>=0?'+':''}$${Math.abs(totalGain).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} (${totalGainPct>=0?'+':''}${totalGainPct.toFixed(2)}%)</span>
          <span style="font-size:12px;color:#475569">עלות $${totalCost.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}</span>
        </div>` : ''}
        <div style="font-size:11px;color:#334155;margin-top:10px">Yahoo Finance · מתרענן כל 90 שניות</div>
      </div>`
    : `<div class="portfolio-summary">
        <div style="font-size:14px;color:#94a3b8;margin-bottom:6px">תיק מניות</div>
        <div style="font-size:22px;font-weight:800;color:#fff">הוסף מניות למעקב</div>
        <div style="font-size:13px;color:#475569;margin-top:6px">מניות ישראל וארה"ב, קרנות, מדדים</div>
      </div>`;

  // Stock cards
  const cards = stocks.map((s, idx) => {
    const c = stockCache[s.sym];
    const loading = stockLoading.has(s.sym) || !c;
    const price  = c?.price || 0;
    const change = c?.change || 0;
    const chgPct = c?.changePct || 0;
    const up     = change >= 0;
    const cur    = c?.currency || 'USD';
    const myVal  = price * (s.shares||0);
    const myCost = (s.avgCost||0) * (s.shares||0);
    const myGain = myCost > 0 ? myVal - myCost : null;
    const myGPct = myCost > 0 ? (myGain/myCost)*100 : null;

    return `<div class="stk-card">
      <div class="stk-hdr">
        <div>
          <div class="stk-sym">${s.sym}</div>
          <div class="stk-name">${c?.name || s.sym}</div>
        </div>
        <div class="stk-price">
          ${loading
            ? `<div class="stk-loading"><div class="stk-mini-spin"></div> טוען</div>`
            : c?.err
              ? `<div style="font-size:12px;color:#dc2626;line-height:1.4">❌ לא נמצא<br><span style="font-size:10px;color:#94a3b8">בדוק סימול · לחץ 🔄</span></div>`
              : `<div class="stk-cur">${fmtP(price,cur)}</div>
                 <div class="stk-chg" style="color:${up?'#16a34a':'#dc2626'}">${up?'▲':'▼'} ${Math.abs(change).toFixed(2)} (${chgPct>=0?'+':''}${chgPct.toFixed(2)}%)</div>`}
        </div>
      </div>
      ${!loading && !c?.err ? `
        <div class="stk-body">
          <div class="stk-stat"><div class="stk-stat-l">שיא יום</div><div class="stk-stat-v">${fmtP(c.high,cur)}</div></div>
          <div class="stk-stat"><div class="stk-stat-l">שפל יום</div><div class="stk-stat-v">${fmtP(c.low,cur)}</div></div>
          <div class="stk-stat"><div class="stk-stat-l">נפח</div><div class="stk-stat-v">${fmtVol(c.volume)}</div></div>
        </div>
        <div style="padding:0 18px 12px">
          <div style="background:${myGain===null?'#f8fafc':myGain>=0?'#f0fdf4':'#fff7f7'};border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:12px;color:#64748b">${s.shares} מניות${s.avgCost?` · עלות ${fmtP(s.avgCost,cur)}`:''}</div>
              <div style="font-size:17px;font-weight:800;color:#1e293b;margin-top:2px">${fmtP(myVal,cur)}</div>
            </div>
            ${myGain!==null?`<div style="text-align:left">
              <div style="font-size:15px;font-weight:900;color:${myGain>=0?'#16a34a':'#dc2626'}">${myGain>=0?'+':''}${fmtP(myGain,cur)}</div>
              <div style="font-size:12px;font-weight:700;color:${myGain>=0?'#16a34a':'#dc2626'}">${myGPct>=0?'+':''}${myGPct.toFixed(2)}%</div>
            </div>`:''}
          </div>
        </div>` : ''}
      <div class="stk-acts" style="padding:12px 18px 16px;gap:10px">
        <button class="stk-act" style="color:#16a34a;font-size:14px;padding:13px 8px" data-idx="${idx}" data-mode="buy" onclick="openBuySell(+this.dataset.idx,'buy')">🟢 קנה</button>
        <button class="stk-act" style="color:#dc2626;font-size:14px;padding:13px 8px" data-idx="${idx}" data-mode="sell" onclick="openBuySell(+this.dataset.idx,'sell')">🔴 מכור</button>
        <button class="stk-act" style="font-size:14px;padding:13px 8px" data-sym="${s.sym}" onclick="refreshStock(this.dataset.sym)">🔄 רענן</button>
        <button class="stk-act" style="color:#94a3b8;font-size:14px;padding:13px 8px" data-idx="${idx}" onclick="removeStock(+this.dataset.idx)">🗑️</button>
      </div>
    </div>`;
  }).join('');

  $('p5').innerHTML =
    hdr +
    `<div style="height:12px"></div>` +
    cards +
    `<div class="add-stk" onclick="openAddStock()">＋ הוסף מניה / קרן / מדד</div>` +
    `<div style="height:8px"></div>`;

  clearTimeout(window._stkT);
  window._stkT = setTimeout(() => { if (TAB===5) drawStocks(); }, 90000);
}

    <div class="ff"><label>מחיר ל${isBuy?'מניה (מחיר קנייה)':'מניה (מחיר מכירה)'}</label>
      <input class="fi" id="bs-price" type="number" inputmode="decimal" placeholder="${c&&!c.err&&c.price?c.price.toFixed(2):'0'}" step="any"></div>
    <div id="bs-preview" style="background:#f0fdf4;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#166534;display:none"></div>
    <button onclick="execBuySell(${idx},'${mode}')" class="fbtn" style="background:${isBuy?'linear-gradient(135deg,#16a34a,#15803d)':'linear-gradient(135deg,#ef4444,#dc2626)'}">
      ${isBuy?'✓ אשר קנייה':'✓ אשר מכירה'}
    </button>`;
  // Live preview
  ['bs-qty','bs-price'].forEach(id => {
    $(id)?.addEventListener('input', updateBSPreview.bind(null, idx, mode));
  });
  actType='bs'; curSheet='act';
  $('sbg').classList.add('on'); $('sh-act').classList.add('on');
}

function updateBSPreview(idx, mode) {
  const s = D.stocks[idx];
  const c = stockCache[s.sym];
  const qty   = parseFloat($('bs-qty')?.value)   || 0;
  const price = parseFloat($('bs-price')?.value) || 0;
  const prev  = $('bs-preview');
  if (!prev || qty <= 0 || price <= 0) { if(prev) prev.style.display='none'; return; }
  const total = qty * price;
  const cur   = c?.currency || 'USD';
  const isBuy = mode === 'buy';
  if (isBuy) {
    const newShares  = (s.shares||0) + qty;
    const newAvgCost = ((s.shares||0)*(s.avgCost||0) + qty*price) / newShares;
    prev.innerHTML = `סה"כ: ${fmtP(total,cur)} · לאחר קנייה: ${newShares.toFixed(4)} מניות · עלות חדשה: ${fmtP(newAvgCost,cur)}`;
  } else {
    const remaining = (s.shares||0) - qty;
    prev.innerHTML = remaining < 0
      ? `<span style="color:#dc2626">⚠️ אין מספיק מניות (יש ${s.shares})</span>`
      : `ייוותרו: ${remaining.toFixed(4)} מניות · תמורה: ${fmtP(total,cur)}`;
  }
  prev.style.display = 'block';
}

function execBuySell(idx, mode) {
  const s     = D.stocks[idx];
  const qty   = parseFloat($('bs-qty')?.value)   || 0;
  const price = parseFloat($('bs-price')?.value) || 0;
  if (qty <= 0)   { toast('הזן כמות'); return; }
  if (price <= 0) { toast('הזן מחיר'); return; }
  const isBuy = mode === 'buy';
  if (isBuy) {
    const newShares  = (s.shares||0) + qty;
    const newAvgCost = ((s.shares||0)*(s.avgCost||0) + qty*price) / newShares;
    s.shares  = +newShares.toFixed(6);
    s.avgCost = +newAvgCost.toFixed(4);
    toast(`✓ קנית ${qty} ${s.sym} במחיר ${price}`);
  } else {
    if (qty > s.shares) { toast(`אין מספיק מניות (יש ${s.shares})`); return; }
    s.shares = +(s.shares - qty).toFixed(6);
    if (s.shares <= 0) {
      D.stocks.splice(idx, 1);
      toast(`${s.sym} נמכר במלואו`);
    } else {
      toast(`✓ מכרת ${qty} ${s.sym} · נותרו ${s.shares}`);
    }
  }
  saveD(); closeSheet(); drawStocks();
}

// ── Add new stock ────────────────────────────────────────────────────────────
function openAddStock() {
  $('sh-act-title').textContent = '＋ הוסף מניה / קרן / מדד';
  $('sh-act-body').innerHTML = `
    <div class="ff">
      <label>סימול (Symbol)</label>
      <input class="fi" id="ns-sym" placeholder="AAPL / NVDA / VOO / TEVA.TA"
        style="text-transform:uppercase;letter-spacing:1px"
        oninput="this.value=this.value.toUpperCase()">
    </div>
    <div style="font-size:12px;color:#94a3b8;margin:-8px 0 14px">
      🇮🇱 ישראל: הוסף <strong>.TA</strong> (TEVA.TA, LUMI.TA, NICE.TA)<br>
      🇺🇸 ארה"ב: AAPL, NVDA, MSFT, VOO, SPY...
    </div>
    <div class="ftwo">
      <div class="ff"><label>כמות מניות</label><input class="fi" id="ns-shares" type="number" inputmode="decimal" placeholder="10" step="any"></div>
      <div class="ff"><label>מחיר קנייה ממוצע</label><input class="fi" id="ns-cost" type="number" inputmode="decimal" placeholder="150" step="any"></div>
    </div>
    <button onclick="saveNewStock()" class="fbtn" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">הוסף ✓</button>`;
  actType='add_stock'; curSheet='act';
  $('sbg').classList.add('on'); $('sh-act').classList.add('on');
}

function saveNewStock() {
  const sym    = txt('ns-sym').toUpperCase().replace(/\s/g,'');
  const shares = parseFloat($('ns-shares')?.value) || 0;
  const cost   = parseFloat($('ns-cost')?.value)   || 0;
  if (!sym) { toast('הזן סימול'); return; }
  if (!D.stocks) D.stocks = [];
  const existing = D.stocks.find(s => s.sym === sym);
  if (existing) {
    // Add to existing position
    const newShares  = existing.shares + shares;
    existing.avgCost = newShares > 0
      ? (existing.shares*existing.avgCost + shares*cost) / newShares
      : cost;
    existing.shares  = +newShares.toFixed(6);
    saveD(); closeSheet(); toast(`${sym} עודכן ✓`); drawStocks(); return;
  }
  D.stocks.push({ sym, shares: +shares, avgCost: +cost, name: '' });
  saveD(); closeSheet();
  toast(`${sym} נוסף — טוען מחיר...`);
  fetchPrice(sym);
}

function removeStock(idx) {
  const sym = D.stocks[idx]?.sym;
  if (!sym) return;
  D.stocks.splice(idx, 1);
  saveD(); toast(`${sym} הוסר`); drawStocks();
}

</script>
</body>
</html>
